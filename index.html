    this.status.setAttribute('align', 'center');
    this.status.setAttribute('width', 1.35);
    this.status.setAttribute('color', '#FFD166');
    this.view.appendChild(this.status);

    this.dummy = document.createElement('a-entity');
    this.dummy.setAttribute('position', {x: this.summit.x, y: this.summit.top, z: this.summit.z});
    this.bodyMaterial = new THREE.MeshStandardMaterial({color: 0x26c6da, roughness: 0.7});
    this.dummyVisual = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.70, 12), this.bodyMaterial);
    torso.position.y = 0.93;
    this.dummyVisual.add(torso);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.20, 12, 10), this.bodyMaterial);
    head.position.y = 1.48;
    this.dummyVisual.add(head);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 8),
      new THREE.MeshStandardMaterial({color: 0x8795a1}));
    post.position.y = 0.30;
    this.dummyVisual.add(post);
    this.dummy.setObject3D('mesh', this.dummyVisual);
    this.el.appendChild(this.dummy);
    this.targetBox.min.set(this.summit.x - 0.30, this.summit.top + 0.55, this.summit.z - 0.30);
    this.targetBox.max.set(this.summit.x + 0.30, this.summit.top + 1.70, this.summit.z + 0.30);
    this.health = document.createElement('a-text');
    this.health.setAttribute('position', {x: this.summit.x, y: this.summit.top + 2, z: this.summit.z});
    this.health.setAttribute('align', 'center');
    this.health.setAttribute('width', 2.6);
    this.health.setAttribute('value', 'SUMMIT DUMMY\nHP 100 / 100');
    this.el.appendChild(this.health);

    this.knifeRoot = new THREE.Group();
    this.knifeVisual = new THREE.Group();
    const bladeMaterial = new THREE.MeshStandardMaterial({color: 0xe0f7ff, metalness: 0.45, roughness: 0.3});
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.012, 0.26), bladeMaterial);
    blade.position.z = -0.12;
    this.knifeVisual.add(blade);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.09, 4), bladeMaterial);
    tip.rotation.x = -Math.PI / 2;
    tip.position.z = -0.295;
    this.knifeVisual.add(tip);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.025, 0.13),
      new THREE.MeshStandardMaterial({color: 0xffb74d}));
    handle.position.z = 0.07;
    this.knifeVisual.add(handle);
    this.knifeRoot.add(this.knifeVisual);
    this.knifeRoot.visible = false;
    this.el.object3D.add(this.knifeRoot);
    this.bladeForward = new THREE.Vector3(0, 0, -1);
    this.aimMatrix = new THREE.Matrix4();
    this.aimOrigin = new THREE.Vector3();
    this.aimDirection = new THREE.Vector3();
    this.aimEnd = new THREE.Vector3();
    this.previousWorld = new THREE.Vector3();
    this.punchDirection = new THREE.Vector3();
    this.punchBox = this.targetBox.clone().expandByScalar(0.10);
    this.orbSphere = new THREE.Sphere(new THREE.Vector3(), 0.18);
    this.throwRequested = false;
    this.contactHintAt = 0;
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    this.aimLine = new THREE.Line(geometry,
      new THREE.LineBasicMaterial({color: 0x55ddff, transparent: true, opacity: 0.55}));
    this.aimLine.frustumCulled = false;
    this.aimLine.visible = false;
    this.el.object3D.add(this.aimLine);
    this.aimDot = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6),
      new THREE.MeshBasicMaterial({color: 0x55ddff}));
    this.aimDot.visible = false;
    this.el.object3D.add(this.aimDot);


    this.initFeedback();
    this.right.addEventListener('triggerdown', () => {
      this.unlockAudio();
      if (this.el.is('vr-mode')) this.requestPrimary();
    });
    this.right.addEventListener('thumbstickdown', () => {
      if (this.el.is('vr-mode')) this.toggleHints();
    });
    window.addEventListener('keydown', event => {
      if (event.repeat || this.el.is('vr-mode')) return;
      if (event.target.closest && event.target.closest('input,textarea,[contenteditable]')) return;
      if (event.code === 'KeyF') { event.preventDefault(); this.requestPrimary(); }
      if (event.code === 'KeyH') { event.preventDefault(); this.toggleHints(); }
    });
    ['enter-vr', 'exit-vr'].forEach(name => this.el.addEventListener(name, () => this.cancelKnife()));
    this.right.addEventListener('controllerdisconnected', () => this.cancelKnife());
    window.addEventListener('blur', () => this.cancelKnife());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.cancelKnife();
    });
  },

  requestPrimary: function () {
    this.throwRequested = true;
    const cutter = this.el.components['plasma-cutter'];
    if (cutter && cutter.active) cutter.beginPress();
  },

  initFeedback: function () {
    this.soundVolume = 0.30;
    this.muted = false;
    try {
      const saved = JSON.parse(localStorage.getItem('descent-audio-v1') || 'null');
      if (saved) {
        if (typeof saved.volume === 'number' && Number.isFinite(saved.volume))
          this.soundVolume = THREE.MathUtils.clamp(saved.volume, 0, 1);
        this.muted = saved.muted === true;
      }
    } catch (error) {}
    this.audioContext = null;
    this.masterGain = null;
    this.effectCursor = 0;
    this.effects = [];
    for (let index = 0; index < 8; index++) {
      const vertices = [];
      for (let ray = 0; ray < 8; ray++) {
        const angle = ray * Math.PI / 4;
        const height = ray % 2 ? 0.5 : -0.5;
        vertices.push(Math.cos(angle) * 0.025, height * 0.025, Math.sin(angle) * 0.025,
          Math.cos(angle) * 0.11, height * 0.11, Math.sin(angle) * 0.11);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      const mesh = new THREE.LineSegments(geometry,
        new THREE.LineBasicMaterial({color: 0xffd166, transparent: true, opacity: 1}));
      mesh.visible = false;
      this.el.object3D.add(mesh);
      this.effects.push({mesh: mesh, life: 0, duration: 0.22});
    }
    // Static scenery blocks projectiles only. Player collisions remain unchanged.
    this.decorativeSolids = [
      {x: -2, z: -5, width: 0.6, depth: 0.6, bottom: 0, top: 3},
      {x: 2, z: -5, width: 0.6, depth: 0.6, bottom: 0, top: 3},
      {x: 0, z: -5, width: 4.6, depth: 0.6, bottom: 3, top: 3.4},
      {x: 4, z: 0, width: 1, depth: 1, bottom: 0, top: 1},
      {x: -4, z: 0, width: 1, depth: 1, bottom: 0, top: 1}
    ];
    this.soundButtons = [];
    this.soundPanel = document.createElement('a-entity');
    const backing = document.createElement('a-plane');
    backing.setAttribute('position', '-3 1.32 -1.66');
    backing.setAttribute('width', 2.05);
    backing.setAttribute('height', 0.7);
    backing.setAttribute('color', '#142232');
    this.soundPanel.appendChild(backing);
    this.soundLabel = document.createElement('a-text');
    this.soundLabel.setAttribute('position', '-3 1.51 -1.62');
    this.soundLabel.setAttribute('align', 'center');
    this.soundLabel.setAttribute('width', 1.8);
    this.soundPanel.appendChild(this.soundLabel);
    ['mute', 'down', 'up', 'test'].forEach((action, index) => {
      const x = -3.69 + index * 0.46;
      const button = document.createElement('a-box');
      button.setAttribute('position', {x: x, y: 1.20, z: -1.60});
      button.setAttribute('width', 0.42);
      button.setAttribute('height', 0.22);
      button.setAttribute('depth', 0.05);
      button.setAttribute('color', '#35516B');
      this.soundPanel.appendChild(button);
      const label = document.createElement('a-text');
      label.setAttribute('position', {x: x, y: 1.20, z: -1.568});
      label.setAttribute('align', 'center');
      label.setAttribute('width', 0.7);
      label.setAttribute('value', ['MUTE', 'VOL -', 'VOL +', 'TEST'][index]);
      this.soundPanel.appendChild(label);
      this.soundButtons.push({action: action,
        box: new THREE.Box3(new THREE.Vector3(x - 0.21, 1.09, -1.635),
          new THREE.Vector3(x + 0.21, 1.31, -1.565))});
    });
    this.el.appendChild(this.soundPanel);
    const panel = document.createElement('div');
    panel.id = 'audio-panel';
    panel.innerHTML = '<span id="audio-label"></span> <button type="button" data-audio="mute">Mute</button> <button type="button" data-audio="down">Vol -</button> <button type="button" data-audio="up">Vol +</button> <button type="button" data-audio="test">Test sound</button>';
    document.body.appendChild(panel);
    panel.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', event => {
        event.stopPropagation();
        this.soundAction(button.dataset.audio);
      });
    });
    panel.addEventListener('keydown', event => event.stopPropagation());
    window.addEventListener('pointerdown', () => this.unlockAudio(), {capture: true});
    window.addEventListener('keydown', event => {
      if (event.target.closest && event.target.closest('input,textarea,[contenteditable],button')) return;
      this.unlockAudio();
      if (event.repeat || this.el.is('vr-mode')) return;
      if (event.code === 'KeyM') this.soundAction('mute');
      if (event.code === 'BracketLeft') this.soundAction('down');
      if (event.code === 'BracketRight') this.soundAction('up');
    });
    this.el.addEventListener('enter-vr', () => this.unlockAudio());
    this.updateAudioSettings();
  },

  unlockAudio: function () {
    try {
      if (!this.audioContext || this.audioContext.state === 'closed') {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return Promise.resolve(false);
        this.audioContext = new Context();
        this.masterGain = this.audioContext.createGain();
        const limiter = this.audioContext.createDynamicsCompressor();
        limiter.threshold.value = -12;
        limiter.knee.value = 16;
        limiter.ratio.value = 6;
        limiter.attack.value = 0.003;
        limiter.release.value = 0.10;
        this.masterGain.connect(limiter);
        limiter.connect(this.audioContext.destination);
        this.updateAudioSettings();
      }
      if (this.audioContext.state === 'suspended') {
        return this.audioContext.resume().then(() => this.audioContext.state === 'running').catch(() => false);
      }
      return Promise.resolve(this.audioContext.state === 'running');
    } catch (error) { return Promise.resolve(false); }
  },

  updateAudioSettings: function () {
    if (this.masterGain && this.audioContext) {
      this.masterGain.gain.setTargetAtTime(this.muted ? 0 : this.soundVolume,
        this.audioContext.currentTime, 0.015);
    }
    const text = this.muted ? 'SFX MUTED' : 'SFX ' + Math.round(this.soundVolume * 100) + '%';
    if (this.soundLabel) this.soundLabel.setAttribute('value', 'SOUND CONTROLS | ' + text + '\nAim at button + right trigger (within 3m)');
    const label = document.querySelector('#audio-label');
    if (label) label.textContent = text;
    try { localStorage.setItem('descent-audio-v1', JSON.stringify({volume: this.soundVolume, muted: this.muted})); }
    catch (error) {}
  },

  soundAction: function (action) {
    const ready = this.unlockAudio();
    if (action === 'mute') this.muted = !this.muted;
    if (action === 'down') this.soundVolume = Math.max(0, Math.round((this.soundVolume - 0.1) * 10) / 10);
    if (action === 'up') this.soundVolume = Math.min(1, Math.round((this.soundVolume + 0.1) * 10) / 10);
    this.updateAudioSettings();
    this.lastHit = this.muted ? 'SFX MUTED' : 'SFX ' + Math.round(this.soundVolume * 100) + '%';
    this.feedbackUntil = this.clock + 1.5;
    if (action === 'test') ready.then(ok => {
      if (ok) this.playEffect('wall');
      else {
        this.lastHit = 'Audio not unlocked - click Test sound in browser';
        this.feedbackUntil = this.clock + 3;
      }
    });
  },

  playEffect: function (kind) {
    const ctx = this.audioContext;
    if (!ctx || ctx.state !== 'running' || this.muted || this.soundVolume <= 0) return;
    const t = ctx.currentTime;
    const tone = (frequency, endFrequency, duration, volume, type) => {
      const oscillator = ctx.createOscillator();
      const envelope = ctx.createGain();
      oscillator.type = type || 'sine';
      oscillator.frequency.setValueAtTime(frequency, t);
      oscillator.frequency.exponentialRampToValueAtTime(endFrequency, t + duration);
      envelope.gain.setValueAtTime(0.0001, t);
      envelope.gain.exponentialRampToValueAtTime(volume, t + 0.005);
      envelope.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      oscillator.connect(envelope);
      envelope.connect(this.masterGain);
      oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
      oscillator.start(t);
      oscillator.stop(t + duration + 0.02);
    };
    try {
      if (kind === 'wall') {
        tone(920, 750, 0.21, 0.14, 'sine');
        tone(1531, 1300, 0.15, 0.07, 'sine');
        tone(2377, 1900, 0.09, 0.035, 'triangle');
      } else if (kind === 'punch') {
        tone(150, 55, 0.12, 0.22, 'triangle');
        tone(80, 45, 0.09, 0.10, 'sine');
      } else if (kind === 'knife') {
        tone(640, 1040, 0.085, 0.14, 'triangle');
        tone(1280, 820, 0.12, 0.055, 'sine');
      } else if (kind === 'ignite') {
        tone(120, 850, 0.22, 0.12, 'triangle');
        tone(60, 220, 0.18, 0.08, 'sine');
      } else if (kind === 'extinguish') {
        tone(650, 85, 0.18, 0.09, 'triangle');
      } else if (kind === 'plasma') {
        tone(180, 70, 0.12, 0.16, 'triangle');
        tone(1700, 540, 0.13, 0.065, 'sine');
      } else if (kind === 'catch') {
        tone(440, 660, 0.075, 0.085, 'sine');
      }
    } catch (error) {}
  },

  hitFeedback: function (kind, position) {
    this.playEffect(kind);
    if (!this.effects || !this.effects.length || !position) return;
    const effect = this.effects[this.effectCursor++ % this.effects.length];
    effect.duration = kind === 'catch' ? 0.13 : 0.22;
    effect.life = effect.duration;
    effect.mesh.position.copy(position);
    effect.mesh.scale.setScalar(kind === 'catch' ? 0.6 : 1);
    effect.mesh.material.color.setHex(kind === 'wall' ? 0xffc04d : kind === 'catch' ? 0x88ffd0 : 0x55ddff);
    effect.mesh.material.opacity = 1;
    effect.mesh.visible = true;
  },

  updateFeedback: function (dt) {
    this.effects.forEach(effect => {
      if (effect.life <= 0) return;
      effect.life = Math.max(0, effect.life - dt);
      const progress = 1 - effect.life / effect.duration;
      effect.mesh.visible = effect.life > 0;
      effect.mesh.material.opacity = 1 - progress;
      effect.mesh.scale.setScalar((effect.duration < 0.2 ? 0.6 : 1) + progress * 1.7);
    });
  },

  blockingDistance: function (start, direction, length, training) {
    let nearest = Infinity;
    const check = solid => {
      this.box.min.set(solid.x - solid.width / 2, solid.bottom || 0, solid.z - solid.depth / 2);
      this.box.max.set(solid.x + solid.width / 2, solid.top, solid.z + solid.depth / 2);
      const distance = this.box.containsPoint(start) ? 0 : this.segmentDistance(start, direction, length, this.box);
      nearest = Math.min(nearest, distance);
    };
    (training.practicePlatforms || []).forEach(check);
    this.decorativeSolids.forEach(check);
    if (direction.y < -0.00001) {
      const floor = (0.01 - start.y) / direction.y;
      if (floor >= 0 && floor <= length) nearest = Math.min(nearest, floor);
    }
    return nearest;
  },

  findSoundButton: function (origin, direction, training) {
    if (!training) return null;
    let best = null;
    let nearest = this.blockingDistance(origin, direction, 3, training);
    this.soundButtons.forEach(button => {
      const distance = this.segmentDistance(origin, direction, 3, button.box);
      if (Number.isFinite(distance) && distance < nearest) {
        nearest = distance;
        best = {action: button.action, distance: distance};
      }
    });
    return best;
  },

  readAim: function (origin, direction) {
    if (!this.el.is('vr-mode')) {
      this.rig.object3D.updateWorldMatrix(true, true);
      this.view.object3D.getWorldPosition(origin);
      this.view.object3D.getWorldQuaternion(this.quaternion);
      direction.set(0, 0, -1).applyQuaternion(this.quaternion).normalize();
      return true;
    }
    const xr = this.el.renderer.xr;
    const session = xr.getSession();
    const frame = xr.getFrame ? xr.getFrame() : this.el.frame;
    const tracked = this.el.systems['tracked-controls'];
    const referenceSpace = tracked && tracked.referenceSpace ?
      tracked.referenceSpace : xr.getReferenceSpace();
    if (!session || session.visibilityState !== 'visible' || !frame || !referenceSpace) return false;
    const source = Array.from(session.inputSources).find(input =>
      input.handedness === 'right' && input.targetRayMode === 'tracked-pointer' && !input.hand);
    if (!source || !source.targetRaySpace) return false;
    let pose;
    try { pose = frame.getPose(source.targetRaySpace, referenceSpace); }
    catch (error) { return false; }
    if (!pose) return false;
    // XR poses are relative to the tracking origin; apply the locomotion parent once.
    const parent = this.right.object3D.parent;
    if (!parent) return false;
    parent.updateWorldMatrix(true, false);
    this.aimMatrix.fromArray(pose.transform.matrix);
    this.aimMatrix.premultiply(parent.matrixWorld);
    origin.setFromMatrixPosition(this.aimMatrix);
    direction.set(0, 0, -1).transformDirection(this.aimMatrix);
    return true;
  },

  segmentSphereDistance: function (start, direction, length, sphere) {
    if (sphere.containsPoint(start)) return 0;
    this.ray.set(start, direction);
    const hit = this.ray.intersectSphere(sphere, this.point);
    if (!hit) return Infinity;
    const distance = start.distanceTo(hit);
    return distance <= length + 0.0001 ? distance : Infinity;
  },

  updateAimGuide: function (training, valid) {
    const visible = valid && this.hints;
    this.aimLine.visible = visible;
    this.aimDot.visible = visible;
    if (!visible) return;
    const cutter = this.el.components['plasma-cutter'];
    const range = cutter && cutter.active ? 12 : 9;
    let distance = range;
    if (this.hp > 0) distance = Math.min(distance,
      this.segmentDistance(this.aimOrigin, this.aimDirection, range, this.targetBox));
    if (training.hp > 0 && !training.resetAt) {
      training.target.object3D.getWorldPosition(this.orbSphere.center);
      distance = Math.min(distance,
        this.segmentSphereDistance(this.aimOrigin, this.aimDirection, range, this.orbSphere));
    }
    distance = Math.min(distance, this.blockingDistance(this.aimOrigin, this.aimDirection, range, training));
    const menu = this.findSoundButton(this.aimOrigin, this.aimDirection, training);
    if (menu) distance = Math.min(distance, menu.distance);
    const guideColor = menu ? 0xffd166 : 0x55ddff;
    this.aimLine.material.color.setHex(guideColor);
    this.aimDot.material.color.setHex(guideColor);
    this.aimEnd.copy(this.aimOrigin).addScaledVector(this.aimDirection, distance);
    const attribute = this.aimLine.geometry.attributes.position;
    attribute.setXYZ(0, this.aimOrigin.x, this.aimOrigin.y, this.aimOrigin.z);
    attribute.setXYZ(1, this.aimEnd.x, this.aimEnd.y, this.aimEnd.z);
    attribute.needsUpdate = true;
    this.aimDot.position.copy(this.aimEnd);
  },

  toggleHints: function () {
    this.hints = !this.hints;
    const training = this.el.components['training-v4'];
    if (training) training.lastHUD = '';
    this.el.querySelectorAll('.tutorial-hint').forEach(el => {
      el.object3D.visible = this.hints;
    });
    const climbing = this.el.components['ledge-climb'];
    if (climbing) climbing.updateGripVisuals();
    this.lastHit = 'Hints ' + (this.hints ? 'ON' : 'OFF');
    this.feedbackUntil = this.clock + 1.5;
    if (!this.hints) { this.aimLine.visible = false; this.aimDot.visible = false; }
  },

  cancelKnife: function () {
    this.throwRequested = false;
    if (this.aimLine) this.aimLine.visible = false;
    if (this.aimDot) this.aimDot.visible = false;
    this.state = 'READY';
    this.cooldown = 0;
    this.flightAge = 0;
    this.knifeRoot.visible = false;
    this.handSamples.forEach(hand => { hand.ready = false; });
  },

  throwKnife: function () {
    if (document.hidden) return;
    const vr = this.el.is('vr-mode');
    if (vr) {
      const session = this.el.renderer.xr.getSession();
      if (session && session.visibilityState !== 'visible') return;
      const training = this.el.components['training-v4'];
      if (!training || !training.hands.some(hand => hand.el === this.right && hand.connected)) return;
    }
    if (!this.readAim(this.origin, this.direction)) {
      this.lastHit = 'XR AIM UNAVAILABLE - try again when tracking returns';
      this.feedbackUntil = this.clock + 1.5;
      return;
    }
    const training = this.el.components['training-v4'];
    const menu = this.findSoundButton(this.origin, this.direction, training);
    if (menu) {
      this.soundAction(menu.action);
      const cutter = this.el.components['plasma-cutter'];
      if (cutter) cutter.clearTrigger();
      return;
    }
    const cutter = this.el.components['plasma-cutter'];
    if (cutter && cutter.active) { cutter.primaryAction(this.origin, this.direction); return; }
    if (this.state !== 'READY' || this.cooldown > 0) return;
    this.knifeRoot.position.copy(this.origin);
    this.velocity.copy(this.direction).multiplyScalar(10);
    this.knifeRoot.quaternion.setFromUnitVectors(this.bladeForward, this.direction);
    this.knifeVisual.rotation.set(0, 0, 0);
    this.distanceTravelled = 0;
    this.flightAge = 0;
    this.hitThisThrow = false;
    this.state = 'OUTBOUND';
    this.knifeRoot.visible = true;
  },

  damageDummy: function (amount, source, contact) {
    if (this.hp <= 0) return;
    this.hp = Math.max(0, this.hp - amount);
    this.hitFeedback(source === 'PLASMA' ? 'plasma' : source === 'KNIFE' ? 'knife' : 'punch',
      contact || (source === 'KNIFE' ? this.knifeRoot.position : this.next));
    this.lastHit = source + ' HIT -' + amount;
    this.feedbackUntil = this.clock + 1.5;
    this.flashUntil = this.clock + 0.18;
    if (this.hp === 0) {
      this.lastHit = 'DUMMY COMPLETE! Resetting on summit';
      this.resetAt = this.clock + 2;
      this.feedbackUntil = this.clock + 2;
    }
    this.health.setAttribute('value', this.hp > 0 ?
      'SUMMIT DUMMY\nHP ' + this.hp + ' / 100' : 'COMPLETE!\nReset in 2 seconds');
  },

  segmentDistance: function (start, direction, length, box) {
    this.ray.set(start, direction);
    const hit = this.ray.intersectBox(box, this.point);
    if (!hit) return Infinity;
    const distance = start.distanceTo(hit);
    return distance <= length + 0.0001 ? distance : Infinity;
  },

  stepKnife: function (dt, training) {
    if (this.state === 'READY') return;
    this.flightAge += dt;
    if (this.flightAge > 6) { this.cancelKnife(); return; }
    this.knifeVisual.rotation.x += dt * 18;
    if (this.state === 'OUTBOUND') {
      const length = Math.min(10 * dt, 9 - this.distanceTravelled);
      this.direction.copy(this.velocity).normalize();
      const position = this.knifeRoot.position;
      let targetDistance = this.hp > 0 && !this.hitThisThrow ?
        this.segmentDistance(position, this.direction, length, this.targetBox) : Infinity;
      let hitKind = 'dummy';
      if (!this.hitThisThrow && training.hp > 0 && !training.resetAt) {
        training.target.object3D.getWorldPosition(this.orbSphere.center);
        const orbDistance = this.segmentSphereDistance(position, this.direction, length, this.orbSphere);
        if (orbDistance < targetDistance) { targetDistance = orbDistance; hitKind = 'orb'; }
      }
      const wallDistance = this.blockingDistance(position, this.direction, length, training);
      if (Number.isFinite(targetDistance) && targetDistance < wallDistance) {
        position.addScaledVector(this.direction, targetDistance);
        this.hitThisThrow = true;
        if (hitKind === 'orb') {
          training.damage(25);
          this.lastHit = 'ORB KNIFE HIT -25';
          this.feedbackUntil = this.clock + 1.5;
        } else {
          this.damageDummy(25, 'KNIFE');
        }
        this.state = 'RETURNING';
      } else if (Number.isFinite(wallDistance)) {
        position.addScaledVector(this.direction, Math.max(0, wallDistance - 0.025));
        this.state = 'RETURNING';
        this.hitFeedback('wall', position);
        this.lastHit = 'BLOCKED - knife returning';
        this.feedbackUntil = this.clock + 1;
      } else {
        position.addScaledVector(this.direction, length);
        this.distanceTravelled += length;
        if (this.distanceTravelled >= 8.999) this.state = 'RETURNING';
      }
    } else if (this.state === 'RETURNING') {
      const source = this.el.is('vr-mode') ? this.right : this.view;
      this.rig.object3D.updateWorldMatrix(true, true);
      source.object3D.getWorldPosition(this.origin);
      this.deltaVector.copy(this.origin).sub(this.knifeRoot.position);
      const distance = this.deltaVector.length();
      if (distance <= Math.max(0.15, 14 * dt)) {
        this.knifeRoot.visible = false;
        this.state = 'READY';
        this.cooldown = 0.45;
        this.hitFeedback('catch', this.origin);
      } else {
        this.direction.copy(this.deltaVector).normalize();
        this.knifeRoot.position.addScaledVector(this.direction, 14 * dt);
        this.knifeRoot.quaternion.setFromUnitVectors(this.bladeForward, this.direction);
      }
    }
  },

  tick: function (time, delta) {
    if (document.hidden || !delta || delta > 100) return;
    if (this.el.is('vr-mode')) {
      const session = this.el.renderer.xr.getSession();
      if (session && session.visibilityState !== 'visible') { this.cancelKnife(); return; }
    }
    const training = this.el.components['training-v4'];
    if (!training) return;
    const dt = delta / 1000;
    this.clock += dt;
    this.cooldown = Math.max(0, this.cooldown - dt);
    this.updateFeedback(dt);
    const aimValid = this.readAim(this.aimOrigin, this.aimDirection);
    this.updateAimGuide(training, aimValid);
    if (this.throwRequested) {
      this.throwRequested = false;
      this.throwKnife();
    }
    this.stepKnife(dt, training);
    if (this.resetAt && this.clock >= this.resetAt) {
      this.resetAt = 0;
      this.hp = 100;
      this.health.setAttribute('value', 'SUMMIT DUMMY\nHP 100 / 100');
    }
    this.bodyMaterial.color.setHex(this.hp === 0 ? 0xffd54f :
      this.clock < this.flashUntil ? 0xff7043 : 0x26c6da);
    this.view.object3D.getWorldPosition(this.origin);
    this.health.object3D.lookAt(this.origin);

    const climbing = this.el.components['ledge-climb'];
    this.handSamples.forEach(sample => {
      const tracked = training.hands.find(hand => hand.el === sample.el);
      const cutter = this.el.components['plasma-cutter'];
      if (!this.el.is('vr-mode') || !tracked || !tracked.connected ||
          (cutter && cutter.active && sample.el === this.right)) { sample.ready = false; return; }
      const object = sample.el.object3D;
      const local = object.position;
      object.updateWorldMatrix(true, false);
      object.getWorldPosition(this.next);
      this.targetBox.clampPoint(this.next, this.point);
      const contactDistance = this.point.distanceTo(this.next);
      const touching = contactDistance <= 0.10;
      const gripping = climbing && climbing.hands.some(hand => hand.el === sample.el && hand.grabbing);
      if (contactDistance > 0.18) sample.armed = true;
      if (sample.ready && !gripping) {
        // Apply today's parent transform to the previous local sample, excluding
        // rig locomotion/snap turning from the measured physical fist movement.
        this.previousWorld.copy(sample.previous).applyMatrix4(object.parent.matrixWorld);
        this.punchDirection.copy(this.next).sub(this.previousWorld);
        const travel = this.punchDirection.length();
        const speed = local.distanceTo(sample.previous) / dt;
        let swept = this.punchBox.containsPoint(this.previousWorld) || touching;
        if (!swept && travel > 0.00001) {
          this.punchDirection.multiplyScalar(1 / travel);
          swept = Number.isFinite(this.segmentDistance(this.previousWorld,
            this.punchDirection, travel, this.punchBox));
        }
        if (sample.armed && swept && speed >= 0.45 && this.clock >= sample.nextHit && this.hp > 0) {
          this.damageDummy(20, 'PUNCH');
          sample.nextHit = this.clock + 0.35;
          sample.armed = false;
        } else if (touching && this.hints && this.hp > 0 && this.clock >= this.contactHintAt &&
                   this.clock >= sample.nextHit) {
          this.lastHit = 'HAND CONTACT - pull back, then make a small punch';
          this.feedbackUntil = this.clock + 0.8;
          this.contactHintAt = this.clock + 1;
        }
      }
      if (gripping) sample.armed = false;
      sample.previous.copy(local);
      sample.ready = true;
      sample.inside = touching;
    });

    const holding = climbing && climbing.hands.some(hand => hand.grabbing);
    const state = holding ? 'HOLD | Stamina ' + Math.ceil(training.stamina) + '/100 (grip costs 0)' : '';
    const knifeState = this.state === 'READY' && this.cooldown > 0 ? 'RECOVERING' : this.state;
    const cutter = this.el.components['plasma-cutter'];
    let text = 'CUTTER LAB v6.0 | ' + (cutter && cutter.active ?
      'CUTTER ' + cutter.state + (cutter.ignited ? ' ON' : ' OFF') +
      (cutter.guiding ? ' | GUIDING -2/s' : '') : 'KNIFE ' + knifeState);
    text += ' | SFX ' + (this.muted ? 'MUTED' : Math.round(this.soundVolume * 100) + '%');
    if (state) text += '\n' + state;
    if (this.clock < this.feedbackUntil) text += '\n' + this.lastHit;
    else if (this.hints) text += this.el.is('vr-mode') ?
      '\nR-stick UP: equip/stow | DOWN: blade | Click: hints' : '\nC: equip/stow | V: blade | F: throw/hold guide/tap recall | H: hints';
    if (text !== this.lastStatus) {
      this.status.setAttribute('value', text);
      this.lastStatus = text;
    }
  }
});
</script>


<script>
AFRAME.registerComponent('plasma-cutter', {
  init: function () {
    this.right = document.querySelector('#right');
    this.view = document.querySelector('#view');
    this.rig = document.querySelector('#rig');
    this.active = false;
    this.ignited = false;
    this.state = 'HELD';
    this.clock = 0;
    this.cooldown = 0;
    this.bladeAmount = 0;
    this.triggerHeld = false;
    this.pressLaunched = false;
    this.pressAt = 0;
    this.guiding = false;
    this.gestureReady = false;
    this.stickReady = true;
    this.historyReady = false;
    this.flightAge = 0;
    this.swingAge = -1;
    this.nextSwing = 0;
    this.armed = {dummy: false, orb: false};
    this.nextHit = {dummy: 0, orb: 0};
    this.contact = {dummy: new THREE.Vector3(), orb: new THREE.Vector3()};
    ['origin', 'aim', 'direction', 'desired', 'velocity', 'end', 'start',
      'tip', 'base', 'localTip', 'localBase', 'oldTip', 'oldBase', 'sweepStart',
      'sweepTip', 'sweepDirection', 'point', 'handLocal', 'gestureStart',
      'gesturePrevious', 'gestureDelta', 'pullDirection', 'offset', 'home',
      'orbCenter'].forEach(name => { this[name] = new THREE.Vector3(); });
    this.quaternion = new THREE.Quaternion();
    this.inverseQuaternion = new THREE.Quaternion();
    this.up = new THREE.Vector3(0, 1, 0);
    this.forward = new THREE.Vector3(0, 0, -1);
    this.targetBox = new THREE.Box3();
    this.orbSphere = new THREE.Sphere(new THREE.Vector3(), 0.23);
    this.root = new THREE.Group();
    const metal = new THREE.MeshStandardMaterial({color: 0x697d90, metalness: 0.7, roughness: 0.3});
    const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.038, 0.24, 10), metal);
    hilt.rotation.x = Math.PI / 2;
    this.root.add(hilt);
    const emitter = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.038, 0.045, 10), metal);
    emitter.rotation.x = Math.PI / 2;
    emitter.position.z = -0.13;
    this.root.add(emitter);
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.055, 0.12),
      new THREE.MeshStandardMaterial({color: 0x172936, roughness: 0.9}));
    grip.position.z = 0.035;
    this.root.add(grip);
    this.beam = new THREE.Group();
    this.beam.position.z = -0.15;
    const core = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.90, 8),
      new THREE.MeshBasicMaterial({color: 0xe8ffff}));
    core.rotation.x = Math.PI / 2;
    core.position.z = -0.45;
    this.beam.add(core);
    const glow = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.92, 8),
      new THREE.MeshBasicMaterial({color: 0x23ddff, transparent: true, opacity: 0.25, depthWrite: false}));
    glow.rotation.x = Math.PI / 2;
    glow.position.z = -0.45;
    this.beam.add(glow);
    this.root.add(this.beam);
    this.root.visible = false;
    this.el.object3D.add(this.root);

    this.right.addEventListener('thumbstickmoved', event => {
      if (!this.el.is('vr-mode')) return;
      const x = event.detail.x, y = event.detail.y;
      if (Math.abs(x) < 0.28 && Math.abs(y) < 0.28) this.stickReady = true;
      if (Math.abs(x) > 0.45) { this.stickReady = false; return; }
      if (!this.stickReady || Math.abs(x) > 0.25 || Math.abs(y) < 0.78) return;
      this.stickReady = false;
      if (y < 0) this.toggleEquip();
      else this.toggleBlade();
    });
    this.right.addEventListener('triggerup', () => this.endPress());
    this.right.addEventListener('controllerdisconnected', () => this.cancel());
    window.addEventListener('keydown', event => {
      if (this.el.is('vr-mode') || event.repeat) return;
      if (event.target.closest && event.target.closest('input,textarea,[contenteditable],button')) return;
      if (event.code === 'KeyC') { event.preventDefault(); this.toggleEquip(); }
      if (event.code === 'KeyV') { event.preventDefault(); this.toggleBlade(); }
    });
    window.addEventListener('keyup', event => { if (event.code === 'KeyF') this.endPress(); });
    ['enter-vr', 'exit-vr'].forEach(name => this.el.addEventListener(name, () => this.cancel()));
    window.addEventListener('blur', () => this.cancel());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.cancel(); });
  },

  feedback: function () { return this.el.components['ability-test']; },

  message: function (text) {
    const fx = this.feedback();
    if (!fx) return;
    fx.lastHit = text;
    fx.feedbackUntil = fx.clock + 2;
  },

  isGripping: function () {
    const climbing = this.el.components['ledge-climb'];
    return this.el.is('vr-mode') && climbing && climbing.hands.some(hand =>
      hand.el === this.right && (hand.held || hand.grabbing));
  },

  toggleEquip: function () {
    const fx = this.feedback();
    if (!fx || document.hidden) return;
    fx.unlockAudio();
    if (this.state !== 'HELD') { this.recall('Recall first, then flick UP to stow'); return; }
    if (fx.state !== 'READY' || fx.cooldown > 0 || this.cooldown > 0) {
      this.message('Wait for the weapon to finish returning'); return;
    }
    if (this.ignited) fx.playEffect('extinguish');
    this.active = !this.active;
    this.ignited = false;
    this.bladeAmount = 0;
    this.historyReady = false;
    this.clearTrigger();
    this.stopHum();
    this.message(this.active ? 'CUTTER EQUIPPED - flick R-stick DOWN to ignite' : 'CUTTER STOWED - knife ready');
  },

  toggleBlade: function () {
    const fx = this.feedback();
    if (!this.active || !fx || document.hidden) return;
    fx.unlockAudio();
    if (this.state !== 'HELD') { this.message('Recall cutter before changing blade power'); return; }
    if (this.isGripping()) { this.message('Release right grip before using cutter'); return; }
    this.ignited = !this.ignited;
    fx.playEffect(this.ignited ? 'ignite' : 'extinguish');
    this.historyReady = false;
    this.armed.dummy = this.armed.orb = false;
    this.message(this.ignited ? 'BLADE ON - swing, or trigger to throw' : 'BLADE OFF');
  },

  beginPress: function () {
    if (!this.active) return;
    this.triggerHeld = true;
    this.pressAt = this.clock;
    this.pressLaunched = false;
  },

  endPress: function () {
    if (!this.triggerHeld) return;
    const tapRecall = this.active && this.state === 'OUTBOUND' &&
      !this.pressLaunched && this.clock - this.pressAt < 0.22;
    this.clearTrigger();
    if (tapRecall) this.recall('CUTTER RECALLED');
  },

  clearTrigger: function () {
    this.triggerHeld = false;
    this.guiding = false;
    this.gestureReady = false;
    this.pressLaunched = false;
  },

  primaryAction: function (origin, direction) {
    if (!this.active || this.state !== 'HELD') return;
    if (this.isGripping()) { this.clearTrigger(); this.message('Release right grip before throwing'); return; }
    if (!this.ignited || this.bladeAmount < 0.9) {
      this.clearTrigger(); this.message('Ignite cutter first: R-stick DOWN / desktop V'); return;
    }
    if (this.cooldown > 0) { this.clearTrigger(); return; }
    this.root.position.copy(origin);
    if (!this.el.is('vr-mode')) {
      this.view.object3D.getWorldQuaternion(this.quaternion);
      this.offset.set(0.22, -0.20, -0.18).applyQuaternion(this.quaternion);
      this.root.position.add(this.offset);
    }
    this.swingAge = -1;
    this.direction.copy(direction).normalize();
    this.root.quaternion.setFromUnitVectors(this.forward, this.direction);
    this.state = 'OUTBOUND';
    this.flightAge = 0;
    this.historyReady = false;
    this.pressLaunched = true;
    this.message('CUTTER THROWN - hold trigger to guide; new quick tap recalls');
  },

  recall: function (text) {
    if (this.state !== 'OUTBOUND') return;
    this.state = 'RETURNING';
    this.clearTrigger();
    if (text) this.message(text);
  },

  cancel: function () {
    this.state = 'HELD';
    this.ignited = false;
    this.bladeAmount = 0;
    this.historyReady = false;
    this.flightAge = 0;
    this.cooldown = 0.3;
    this.swingAge = -1;
    this.clearTrigger();
    this.root.visible = false;
    this.beam.visible = false;
    this.stopHum();
  },

  stopHum: function () {
    if (!this.hum) return;
    try { this.hum.oscillator.stop(); } catch (error) {}
    this.hum.oscillator.disconnect();
    this.hum.gain.disconnect();
    this.hum = null;
  },

  updateHum: function (audible) {
    const fx = this.feedback();
    const ctx = fx && fx.audioContext;
    if (!audible || !ctx || ctx.state !== 'running' || fx.muted || fx.soundVolume <= 0) {
      this.stopHum(); return;
    }
    if (!this.hum) {
      try {
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = 'triangle';
        oscillator.frequency.value = 105;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.023, ctx.currentTime + 0.08);
        oscillator.connect(gain);
        gain.connect(fx.masterGain);
        oscillator.start();
        this.hum = {oscillator: oscillator, gain: gain};
      } catch (error) { this.hum = null; }
    }
  },

  desktopSwing: function () {
    if (!this.active || this.state !== 'HELD' || !this.ignited || this.clock < this.nextSwing) return;
    this.swingAge = 0;
    this.nextSwing = this.clock + 0.45;
  },

  updateGuidance: function (dt, training) {
    this.guiding = this.triggerHeld && this.clock - this.pressAt >= 0.22 && !this.isGripping();
    if (!this.guiding) { this.gestureReady = false; return; }
    if (training.stamina <= 0) { this.recall('STAMINA EMPTY - free recall'); return; }
    training.stamina = Math.max(0, training.stamina - 2 * dt);
    if (training.stamina <= 0) { this.recall('STAMINA EMPTY - free recall'); return; }
    this.desired.copy(this.aim);
    if (this.el.is('vr-mode')) {
      this.handLocal.copy(this.right.object3D.position);
      if (!this.gestureReady) {
        this.gestureStart.copy(this.handLocal);
        this.gesturePrevious.copy(this.handLocal);
        this.pullDirection.copy(this.view.object3D.position).sub(this.handLocal);
        this.pullDirection.y = 0;
        if (this.pullDirection.lengthSq() < 0.01) {
          this.right.object3D.parent.getWorldQuaternion(this.inverseQuaternion);
          this.inverseQuaternion.invert();
          this.pullDirection.copy(this.aim).negate().applyQuaternion(this.inverseQuaternion);
          this.pullDirection.y = 0;
        }
        if (this.pullDirection.lengthSq() < 0.001) this.pullDirection.set(0, 0, 1);
        this.pullDirection.normalize();
        this.gestureAt = this.clock;
        this.gestureReady = true;
      }
      this.gestureDelta.copy(this.handLocal).sub(this.gesturePrevious);
      const pullSpeed = this.gestureDelta.dot(this.pullDirection) / dt;
      this.gestureDelta.copy(this.handLocal).sub(this.gestureStart);
      const pullDistance = this.gestureDelta.dot(this.pullDirection);
      if (pullDistance > 0.18 && pullSpeed > 0.35 && this.clock - this.gestureAt < 1.3) {
        this.recall('PULL GESTURE - returning'); return;
      }
      // Physical hand offsets are local to the rig: walking/turning are not gestures.
      this.offset.copy(this.gestureDelta);
      this.offset.addScaledVector(this.pullDirection, -this.offset.dot(this.pullDirection));
      this.offset.clampLength(0, 0.30);
      this.right.object3D.parent.getWorldQuaternion(this.quaternion);
      this.offset.applyQuaternion(this.quaternion);
      this.desired.addScaledVector(this.offset, 1.8).normalize();
      this.gesturePrevious.copy(this.handLocal);
      if (this.clock - this.gestureAt > 1.3) {
        this.gestureStart.copy(this.handLocal);
        this.gestureAt = this.clock;
      }
    }
    const angle = this.direction.angleTo(this.desired);
    const step = Math.min(1, (2.8 * dt) / Math.max(angle, 0.00001));
    this.quaternion.setFromUnitVectors(this.direction, this.desired);
    // Quaternion interpolation avoids a zero vector during a 180-degree turn.
    this.inverseQuaternion.identity().slerp(this.quaternion, step);
    this.direction.applyQuaternion(this.inverseQuaternion).normalize();
  },

  testBladeSegment: function (base, tip, training, hits) {
    const fx = this.feedback();
    this.sweepDirection.copy(tip).sub(base);
    const length = this.sweepDirection.length();
    if (length < 0.0001) return;
    this.sweepDirection.multiplyScalar(1 / length);
    let wall = fx.blockingDistance(base, this.sweepDirection, length, training);
    let dummy = Infinity, orb = Infinity;
    if (fx.hp > 0) {
      this.targetBox.copy(fx.targetBox).expandByScalar(0.04);
      dummy = this.targetBox.containsPoint(base) ? 0 :
        fx.segmentDistance(base, this.sweepDirection, length, this.targetBox);
    }
    if (training.hp > 0 && !training.resetAt) {
      training.target.object3D.getWorldPosition(this.orbSphere.center);
      orb = fx.segmentSphereDistance(base, this.sweepDirection, length, this.orbSphere);
    }
    if (dummy < wall && dummy <= orb) {
      hits.dummy = true;
      this.contact.dummy.copy(base).addScaledVector(this.sweepDirection, dummy);
    } else if (orb < wall) {
      hits.orb = true;
      this.contact.orb.copy(base).addScaledVector(this.sweepDirection, orb);
    }
  },

  damageTarget: function (kind, amount, training) {
    const fx = this.feedback();
    if (kind === 'dummy') fx.damageDummy(amount, 'PLASMA', this.contact.dummy);
    else {
      training.damage(amount, 'plasma');
      this.message('ORB PLASMA HIT -' + amount);
    }
  },

  stepMelee: function (dt, training) {
    const parent = this.right.object3D.parent;
    this.base.copy(this.root.position).addScaledVector(this.aim, 0.15);
    this.tip.copy(this.root.position).addScaledVector(this.aim, 1.05);
    this.localBase.copy(this.base);
    this.localTip.copy(this.tip);
    // Both controller and desktop camera are direct children of the same rig.
    parent.worldToLocal(this.localBase);
    parent.worldToLocal(this.localTip);
    if (!this.historyReady) {
      this.oldBase.copy(this.localBase);
      this.oldTip.copy(this.localTip);
      this.historyReady = true;
      this.armed.dummy = this.armed.orb = false;
      return;
    }
    const travel = this.localTip.distanceTo(this.oldTip);
    const speed = travel / dt;
    const hits = {dummy: false, orb: false};
    const steps = Math.min(16, Math.max(1, Math.ceil(travel / 0.04)));
    for (let index = 0; index <= steps; index++) {
      const fraction = index / steps;
      this.sweepStart.copy(this.oldBase).lerp(this.localBase, fraction);
      this.sweepTip.copy(this.oldTip).lerp(this.localTip, fraction);
      parent.localToWorld(this.sweepStart);
      parent.localToWorld(this.sweepTip);
      this.testBladeSegment(this.sweepStart, this.sweepTip, training, hits);
    }
    ['dummy', 'orb'].forEach(kind => {
      if (!hits[kind]) this.armed[kind] = true;
      if (hits[kind] && this.armed[kind] && speed >= 0.45 && this.clock >= this.nextHit[kind]) {
        this.damageTarget(kind, 30, training);
        this.armed[kind] = false;
        this.nextHit[kind] = this.clock + 0.4;
      }
    });
    this.oldBase.copy(this.localBase);
    this.oldTip.copy(this.localTip);
  },

  stepFlight: function (dt, training) {
    const fx = this.feedback();
    this.flightAge += dt;
    // Recall is non-damaging and ignores scenery, just like the existing knife return.
    if (this.flightAge > 15) { this.cancel(); this.message('CUTTER RECOVERED SAFELY'); return; }
    if (this.state === 'OUTBOUND') {
      this.updateGuidance(dt, training);
      if (this.state !== 'OUTBOUND') return;
      const length = 9 * dt;
      this.start.copy(this.root.position);
      this.end.copy(this.start).addScaledVector(this.direction, length + 1.05);
      const hits = {dummy: false, orb: false};
      this.testBladeSegment(this.start, this.end, training, hits);
      let kind = hits.dummy ? 'dummy' : hits.orb ? 'orb' : null;
      if (kind) {
        this.root.position.copy(this.start).addScaledVector(this.direction,
          Math.max(0, this.start.distanceTo(this.contact[kind]) - 1.05));
        this.damageTarget(kind, 25, training);
        this.recall();
      } else {
        const wall = fx.blockingDistance(this.start, this.direction, length + 1.05, training);
        if (Number.isFinite(wall)) {
          this.point.copy(this.start).addScaledVector(this.direction, wall);
          this.root.position.copy(this.start).addScaledVector(this.direction, Math.max(0, wall - 1.075));
          fx.hitFeedback('wall', this.point);
          this.recall('CUTTER BLOCKED - returning');
        } else {
          this.root.position.addScaledVector(this.direction, length);
          if (this.root.position.distanceTo(this.origin) >= 12 || this.flightAge > 12)
            this.recall('CUTTER RANGE LIMIT - returning');
        }
      }
      this.root.quaternion.setFromUnitVectors(this.forward, this.direction);
    } else {
      this.home.copy(this.origin);
      this.velocity.copy(this.home).sub(this.root.position);
      const distance = this.velocity.length();
      if (distance <= Math.max(0.16, 15 * dt)) {
        this.root.position.copy(this.home);
        this.state = 'HELD';
        this.cooldown = 0.4;
        this.clearTrigger();
        this.historyReady = false;
        fx.hitFeedback('catch', this.home);
        this.message('CUTTER CAUGHT');
      } else {
        this.velocity.multiplyScalar(1 / distance);
        this.root.position.addScaledVector(this.velocity, 15 * dt);
        this.root.quaternion.setFromUnitVectors(this.forward, this.velocity);
      }
    }
  },

  tick: function (time, delta) {
    if (!delta) return;
    if (document.hidden || delta > 100) { this.cancel(); return; }
    const dt = delta / 1000;
    this.clock += dt;
    this.cooldown = Math.max(0, this.cooldown - dt);
    const fx = this.feedback();
    const training = this.el.components['training-v4'];
    if (!fx || !training || !this.active) {
      this.root.visible = false;
      this.stopHum();
      return;
    }
    if (!fx.readAim(this.origin, this.aim)) { this.cancel(); return; }
    const vr = this.el.is('vr-mode');
    if (!vr) {
      this.view.object3D.getWorldQuaternion(this.quaternion);
      this.offset.set(0.22, -0.20, -0.18).applyQuaternion(this.quaternion);
      this.origin.add(this.offset);
      if (this.swingAge >= 0 && this.state === 'HELD') {
        this.swingAge += dt;
        if (this.swingAge > 0.28) this.swingAge = -1;
        else this.aim.applyAxisAngle(this.up, 0.65 - (this.swingAge / 0.28) * 1.3).normalize();
      }
    }
    const gripping = this.isGripping();
    this.root.visible = this.state !== 'HELD' || !gripping;
    this.bladeAmount = THREE.MathUtils.clamp(this.bladeAmount + (this.ignited ? 1 : -1) * dt * 7, 0, 1);
    this.beam.scale.z = Math.max(0.001, this.bladeAmount);
    this.beam.visible = this.bladeAmount > 0.01;
    if (this.state === 'HELD') {
      this.root.position.copy(this.origin);
      this.root.quaternion.setFromUnitVectors(this.forward, this.aim);
      if (this.ignited && this.bladeAmount > 0.9 && !gripping && this.cooldown <= 0)
        this.stepMelee(dt, training);
      else this.historyReady = false;
    } else this.stepFlight(dt, training);
    this.updateHum(this.active && this.ignited && this.root.visible);
  }
});
</script>

</head>

<body>

<div id="hud">Loading Cutter Lab v6.0...</div>

<a-scene

  background="color: #182333">

  <a-light
    type="ambient"

  </a-light>

  <a-light
    type="directional"
    position="2 5 3"

  </a-light>

  <a-plane
    rotation="-90 0 0"
    width="18"
    height="18"
    color="#52616B">
  </a-plane>

  <!-- Virtual walking boundary -->

  <a-box
    position="0 0.015 -7.3"
    width="14.6"
    height="0.03"
    depth="0.08"
    color="#FFD54F">
  </a-box>

  <a-box
    position="0 0.015 7.3"
    width="14.6"
    height="0.03"
    depth="0.08"
    color="#FFD54F">
  </a-box>

  <a-box
    position="-7.3 0.015 0"
    width="0.08"
    height="0.03"
    depth="14.6"
    color="#FFD54F">
  </a-box>

  <a-box
    position="7.3 0.015 0"
    width="0.08"
    height="0.03"
    depth="14.6"
    color="#FFD54F">
  </a-box>

  <a-ring
    position="0 0.02 0"
    rotation="-90 0 0"
    radius-inner="0.65"
    radius-outer="0.72"
    color="#26C6DA">
  </a-ring>

  <!-- Visual landmarks: projectile collision only; no new player collision -->

  <a-box
    position="-2 1.5 -5"
    width="0.6"
    height="3"
    depth="0.6"
    color="#8795A1">
  </a-box>

  <a-box
    position="2 1.5 -5"
    width="0.6"
    height="3"
    depth="0.6"
    color="#8795A1">
  </a-box>

  <a-box
    position="0 3.2 -5"
    width="4.6"
    height="0.4"
    depth="0.6"

  </a-box>

  <a-box
    position="4 0.5 0"

  </a-box>

  <a-box
    position="-4 0.5 0"
    color="#9276C5">
  </a-box>

  <!-- Instructions -->

  <a-plane class="tutorial-hint"
    position="-3 1.7 -3"

    height="3.0"

  </a-plane>

  <a-text class="tutorial-hint"
    position="-3 1.7 -2.98"
    align="center"
    width="2.5"
    color="white"
    value="VR CONTROLS\nLeft stick: move\nRight stick: turn\nA: jump / ledge launch\nLeft stick click: sprint\nX: smooth / snap\nY: turning speed\nB: walking speed\nLeft trigger: reset orb\nRight trigger: weapon\nR-stick UP: equip cutter / knife\nR-stick DOWN: blade on / off\nHold trigger: guide cutter\nNew trigger tap: recall\nRight stick click: hints">
  </a-text>

  <a-text
    position="0 2.5 -5"
    align="center"

    value="DESCENT VR\nCUTTER LAB v6.0">
  </a-text>

  <!-- Practice target -->

  <a-sphere
    id="target"

  </a-sphere>

  <a-text
    id="health"
    position="0 1.7 -0.65"
    value="HP 100 / 100"
    align="center"
    width="0.8"
    color="white">
  </a-text>

  <!-- Player -->

  <a-entity id="rig">

    <a-entity
      id="view"
      camera
      position="0 1.6 0"
      look-controls>

      <a-text
        id="vrhud"
        position="0 -0.4 -1.3"
        align="center"
        width="1.4"
        color="white">
      </a-text>

    </a-entity>

    <a-entity
      id="left"
      meta-touch-controls="hand: left">
    </a-entity>

    <a-entity
      id="right"
      meta-touch-controls="hand: right">
    </a-entity>

  </a-entity>

</a-scene>
</body>
